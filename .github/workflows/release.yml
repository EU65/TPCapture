name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TPCAPTURE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TPCAPTURE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TPCAPTURE_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::缺少 secret TPCAPTURE_KEYSTORE_BASE64 / TPCAPTURE_KEYSTORE_PASSWORD"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/tpcapture.jks"
          {
            echo "TPCAPTURE_KEYSTORE_FILE=$RUNNER_TEMP/signing/tpcapture.jks"
            echo "TPCAPTURE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "TPCAPTURE_KEY_ALIAS=${KEY_ALIAS:-tpcapture}"
            echo "TPCAPTURE_KEY_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Resolve version and rename APK
        id: meta
        run: |
          VERSION=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "TPCapture-$VERSION.apk"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n1)
          "$APKSIGNER" verify --print-certs "TPCapture-${{ steps.meta.outputs.version }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPCapture-${{ steps.meta.outputs.version }}
          path: TPCapture-*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: TPCapture ${{ steps.meta.outputs.version }}
          files: TPCapture-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
